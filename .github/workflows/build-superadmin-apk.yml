name: Build SUPERADMIN APK

on:
  push:
    branches:
      - superadmin-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        working-directory: superadmin-android
        env:
          STORE_PASS: 'MacflaySuperAdmin2026'
          KEY_PASS: 'MacflaySuperAdmin2026'
        run: |
          keytool -genkeypair -v \
            -keystore superadmin-release.jks \
            -storepass "$STORE_PASS" \
            -alias superadmin \
            -keypass "$KEY_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MACFLAY SUPERADMIN, O=MACFLAY, C=BR"

      - name: Build release APK
        working-directory: superadmin-android
        env:
          SIGNING_STORE_FILE: '../superadmin-release.jks'
          SIGNING_STORE_PASSWORD: 'MacflaySuperAdmin2026'
          SIGNING_KEY_ALIAS: 'superadmin'
          SIGNING_KEY_PASSWORD: 'MacflaySuperAdmin2026'
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare artifact
        run: |
          mkdir -p output
          cp superadmin-android/app/build/outputs/apk/release/app-release.apk output/MACFLAY-SUPERADMIN-v1.0.0.apk
          sha256sum output/MACFLAY-SUPERADMIN-v1.0.0.apk | tee output/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: macflay-superadmin-apk
          path: output/
          if-no-files-found: error
          retention-days: 7
