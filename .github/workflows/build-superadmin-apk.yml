name: Build SUPERADMIN APK

on:
  push:
    branches:
      - superadmin-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: superadmin-android
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare unsigned APK and signer
        run: |
          mkdir -p output
          cp superadmin-android/app/build/outputs/apk/release/app-release-unsigned.apk output/MAC-SUPERADMIN-v1.0.3-unsigned.apk
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" output/apksigner.jar
          sha256sum output/MAC-SUPERADMIN-v1.0.3-unsigned.apk | tee output/SHA256SUMS.txt

      - name: Upload unsigned build tools
        uses: actions/upload-artifact@v4
        with:
          name: mac-superadmin-unsigned-v1.0.3
          path: output/
          if-no-files-found: error
          retention-days: 1
