<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050608"><title>MAC SUPERADMIN</title><style>
:root{--bg:#050608;--panel:#111419;--panel2:#171b20;--line:#252a31;--text:#f7f8fa;--muted:#929ba7;--red:#ef1b24;--green:#16c866;--blue:#168ee8;--orange:#f28b13;--danger:#d72a32}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{width:min(560px,100%);min-height:100vh;margin:auto;background:radial-gradient(circle at 50% -20%,#250306 0,#090b0e 34%,#050608 72%);position:relative;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 13px 8px;background:rgba(5,6,8,.96);backdrop-filter:blur(14px)}.toprow{height:50px;display:flex;align-items:center;gap:8px}.mac{display:flex;align-items:baseline;font-size:27px;font-weight:1000;font-style:italic;letter-spacing:-4px;line-height:1}.mac .ma{color:#f01822}.mac .c{color:#fff;margin-left:1px}.brandname{font-size:15px;font-weight:950;letter-spacing:.4px}.grow{flex:1}.topicon{width:36px;height:36px;border:0;background:transparent;color:#fff;font-size:22px;display:grid;place-items:center}.main{padding:9px 12px calc(86px + env(safe-area-inset-bottom))}.welcome{font-size:12px;color:#8d96a2;margin:0 0 8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}.metric{min-height:92px;border-radius:14px;padding:13px 12px;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px rgba(255,255,255,.05)}.metric.green{background:linear-gradient(145deg,#063a23,#087042)}.metric.red{background:linear-gradient(145deg,#561116,#941820)}.metric.blue{background:linear-gradient(145deg,#07355d,#0962a8)}.metric.orange{background:linear-gradient(145deg,#603100,#a05700)}.metric span{font-size:11px;color:#f2f4f6}.metric b{display:block;font-size:23px;margin:4px 0 2px;letter-spacing:-.5px}.metric small{font-size:10px;color:rgba(255,255,255,.76)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 9px}.sectionhead h2{margin:0;font-size:16px}.textbtn{border:0;background:transparent;color:#ff2831;font-size:11px;font-weight:900}.searchbar{display:flex;gap:7px;margin-bottom:10px}.searchbar input{flex:1;min-width:0;height:42px;border-radius:11px;border:1px solid var(--line);background:#111419;color:#fff;padding:0 12px;outline:none}.searchbar select{width:108px;border-radius:11px;border:1px solid var(--line);background:#14181d;color:#fff;padding:0 8px}.client{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#15191e,#111419);border:1px solid #22272e;border-radius:13px;padding:11px;margin-bottom:9px}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#08090b;border:1px solid #343a43;color:#ff2831;font-size:16px;font-weight:1000;flex:0 0 auto}.cmain{flex:1;min-width:0}.cname{font-size:13px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmeta{font-size:10px;color:#9aa3af;margin-top:2px}.cright{text-align:right;flex:0 0 auto}.price{font-size:12px;font-weight:950;margin-top:5px}.arrow{font-size:22px;color:#aab2bd}.pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950}.pill.green{background:#0b6b38;color:#d6ffe5}.pill.red{background:#7b141a;color:#ffd7da}.pill.yellow{background:#734900;color:#ffe8ae}.pill.gray{background:#30343a;color:#ddd}.hubrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#121519;border:1px solid #232830;border-radius:13px;padding:13px 12px;margin-bottom:9px}.hubrow b{font-size:13px}.hubrow small{display:block;color:#929ba7;font-size:10px;margin-top:3px}.hubval{text-align:right;font-size:12px;font-weight:950}.moregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.morecard{min-height:108px;border:1px solid #252a31;border-radius:15px;background:#121519;color:#fff;padding:14px;text-align:left}.morecard.red{border-color:#6b171b;background:#251012}.morecard .ico{font-size:24px;color:#ff2831}.morecard strong{display:block;font-size:14px;margin-top:18px}.morecard span{font-size:10px;color:#929ba7}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(560px,100%);height:calc(68px + env(safe-area-inset-bottom));padding:5px 7px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;align-items:center;background:rgba(7,8,10,.98);border-top:1px solid #23272d}.nav{border:0;background:transparent;color:#929ba7;font-size:9px;font-weight:850;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 1px}.nav .ni{font-size:20px;line-height:20px}.nav.on{color:#ff2029}.nav.plus .ni{width:50px;height:50px;border-radius:50%;margin-top:-25px;background:#ff2029;color:#fff;display:grid;place-items:center;font-size:31px;box-shadow:0 8px 28px rgba(255,32,41,.35)}.empty{padding:28px;text-align:center;color:#8f98a4;border:1px dashed #2d333b;border-radius:14px}.login{min-height:100vh;display:grid;place-items:center;padding:26px;background:radial-gradient(circle at 50% 15%,#310408 0,#0b0d10 38%,#000 78%)}.loginbox{width:min(410px,100%);background:#0d1014;border:1px solid #292f37;border-radius:24px;padding:24px;box-shadow:0 30px 90px #000}.loginbrand{text-align:center;margin-bottom:22px}.loginbrand .mac{justify-content:center;font-size:52px;letter-spacing:-7px}.loginbrand h1{font-size:22px;margin:9px 0 4px}.loginbrand p{margin:0;color:#9aa3ae;font-size:12px}.field{margin:11px 0}.field label{display:block;font-size:10px;font-weight:900;color:#b8c0ca;letter-spacing:.7px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #29303a;background:#111419;color:#fff;border-radius:12px;padding:12px;outline:none}.primary,.secondary,.danger,.good{border:0;border-radius:12px;padding:12px 14px;font-weight:900;color:#fff}.primary{background:#ef1b24}.secondary{background:#22272e}.danger{background:#a91e25}.good{background:#08763d}.full{width:100%}.msg{color:#ff9096;font-size:12px;margin-top:10px}.sheetback,.modalback{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none}.sheetback.on,.modalback.on{display:block}.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:0;width:min(560px,100%);max-height:92vh;background:#0b0d10;border:1px solid #252a31;border-bottom:0;border-radius:23px 23px 0 0;z-index:60;transition:.2s;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet.on{transform:translateX(-50%) translateY(0)}.sheeth{position:sticky;top:0;background:rgba(11,13,16,.98);z-index:3;padding:14px;border-bottom:1px solid #242a31}.sheettop{display:flex;gap:9px;align-items:center}.backbtn{width:38px;height:38px;border-radius:50%;border:1px solid #2c323a;background:#15191e;color:#fff;font-size:20px}.stitle{flex:1;min-width:0}.stitle b{font-size:16px}.stitle small{display:block;color:#929ba7;font-size:10px}.tabs{display:flex;gap:5px;overflow:auto;margin-top:12px}.tab{white-space:nowrap;border:0;background:transparent;color:#919aa6;padding:8px 9px;font-size:10px;font-weight:900;border-bottom:2px solid transparent}.tab.on{color:#fff;border-bottom-color:#ef1b24}.sheetbody{padding:12px}.card{background:#121519;border:1px solid #242a31;border-radius:14px;padding:13px;margin-bottom:10px}.card h3{font-size:14px;margin:0 0 9px}.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #242a31}.line:last-child{border-bottom:0}.line span{font-size:11px;color:#929ba7}.line b{font-size:12px;text-align:right}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions .wide{grid-column:1/-1}.device{background:#0d1014;border:1px solid #292f37;border-radius:12px;padding:11px;margin-bottom:8px}.device .uid{font:9px ui-monospace,monospace;color:#6f7985;word-break:break-all}.modalback{z-index:80;place-items:center;padding:15px}.modalback.on{display:grid}.modal{width:min(500px,100%);max-height:88vh;overflow:auto;background:#121519;border:1px solid #2b3139;border-radius:20px;padding:17px}.modal h2{font-size:18px;margin:0 0 12px}.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(160px);z-index:100;background:#242a31;border:1px solid #49525e;border-radius:12px;padding:11px 14px;color:#fff;max-width:90%;font-size:12px;transition:.2s}.toast.on{transform:translateX(-50%) translateY(0)}
</style></head><body>
<section id="loginView" class="login"><div class="loginbox"><div class="loginbrand"><div class="mac"><span class="ma">MA</span><span class="c">C</span></div><h1>MAC SUPERADMIN</h1><p>Controle total na palma da sua mão.</p></div><div class="field"><label>USUÁRIO</label><input id="user" autocomplete="username" placeholder="Seu usuário"></div><div class="field"><label>SENHA</label><input id="pass" type="password" autocomplete="current-password" placeholder="••••••••"></div><button id="loginBtn" class="primary full" onclick="login()">ENTRAR</button><div id="loginMsg" class="msg"></div></div></section>
<section id="appView" class="app hidden"><header class="top"><div class="toprow"><div class="mac"><span class="ma">MA</span><span class="c">C</span></div><div class="brandname">SUPERADMIN</div><div class="grow"></div><button class="topicon" onclick="loadDashboard()">↻</button><button class="topicon" onclick="navigate('more')">☰</button></div></header><main class="main"><p id="welcome" class="welcome">Painel de gestão</p><div id="content"></div></main><nav class="bottom"><button class="nav on" data-v="home" onclick="navigate('home')"><span class="ni">⌂</span>Início</button><button class="nav" data-v="clients" onclick="navigate('clients')"><span class="ni">♙</span>Clientes</button><button class="nav plus" onclick="openCreate()"><span class="ni">+</span></button><button class="nav" data-v="devices" onclick="navigate('devices')"><span class="ni">▣</span>Aparelhos</button><button class="nav" data-v="more" onclick="navigate('more')"><span class="ni">•••</span>Mais</button></nav></section>
<div id="sheetBack" class="sheetback" onclick="closeSheet()"></div><aside id="sheet" class="sheet"><div class="sheeth"><div class="sheettop"><button class="backbtn" onclick="closeSheet()">‹</button><div class="stitle"><b id="sheetTitle">Cliente</b><small id="sheetSub"></small></div><span id="sheetStatus" class="pill green">ATIVO</span></div><div id="tabs" class="tabs"></div></div><div id="sheetBody" class="sheetbody"></div></aside>
<div id="modalBack" class="modalback" onclick="modalClick(event)"><div id="modal" class="modal"></div></div><div id="toast" class="toast"></div>
<script>
const API='https://pwzmywuxdgutslqeypas.supabase.co/functions/v1/superadmin-api';let token=localStorage.getItem('mac_sa_token')||'',refreshToken=localStorage.getItem('mac_sa_refresh')||'',DATA=null,DETAIL=null,view='home',detailTab='summary';const E=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});const date=v=>v?new Date(v).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';const dt=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';function toast(m){const t=E('toast');t.textContent=m;t.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('on'),2800)}async function api(action,p={},retry=true){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify({action,...p})});let d={};try{d=await r.json()}catch{}if(r.status===401&&retry&&refreshToken&&action!=='login'&&action!=='refresh'){if(await refresh())return api(action,p,false)}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}async function refresh(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh',refresh_token:refreshToken})});const d=await r.json();if(!r.ok)return false;token=d.access_token||'';refreshToken=d.refresh_token||refreshToken;localStorage.setItem('mac_sa_token',token);localStorage.setItem('mac_sa_refresh',refreshToken);return true}catch{return false}}async function login(){E('loginMsg').textContent='';E('loginBtn').disabled=true;try{const d=await api('login',{username:E('user').value,password:E('pass').value},false);token=d.access_token;refreshToken=d.refresh_token||'';localStorage.setItem('mac_sa_token',token);localStorage.setItem('mac_sa_refresh',refreshToken);E('pass').value='';E('loginView').classList.add('hidden');E('appView').classList.remove('hidden');E('welcome').textContent=(d.admin?.display_name||d.profile?.display_name||'SUPERADMIN')+' • Gestão central';await loadDashboard()}catch(e){E('loginMsg').textContent=e.message}finally{E('loginBtn').disabled=false}}function logout(){token='';refreshToken='';DATA=null;localStorage.removeItem('mac_sa_token');localStorage.removeItem('mac_sa_refresh');E('appView').classList.add('hidden');E('loginView').classList.remove('hidden');closeSheet()}async function init(){if(token){try{const m=await api('me');E('loginView').classList.add('hidden');E('appView').classList.remove('hidden');E('welcome').textContent=(m.display_name||'SUPERADMIN')+' • Gestão central';await loadDashboard();return}catch{logout()}}}async function loadDashboard(){try{DATA=await api('dashboard');render()}catch(e){toast(e.message)}}function status(c){if(c.status==='cancelled')return ['CANCELADO','gray'];if(c.license?.allowed)return ['ATIVO','green'];if(/vencid|mensalidade/i.test(c.license?.reason||''))return ['VENCIDO','red'];return ['BLOQUEADO','red']}function setNav(){document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}function navigate(v){view=v;setNav();render()}function render(){if(!DATA)return;if(view==='home')home();else if(view==='clients')clients();else if(view==='devices')devicesHub();else if(view==='payments')paymentsHub();else more()}function home(){const m=DATA.metrics||{},bs=DATA.businesses||[],dev=bs.reduce((n,c)=>n+Number(c.approved_devices||0),0);E('content').innerHTML='<div class="metrics"><div class="metric green"><span>Clientes Ativos</span><b>'+Number(m.active||0)+'</b><small>● Ativos</small></div><div class="metric red"><span>Vencidos</span><b>'+Number(m.overdue||0)+'</b><small>● Atenção</small></div><div class="metric blue"><span>Receita (Mês)</span><b>'+money(m.mrr||0)+'</b><small>MRR</small></div><div class="metric orange"><span>Aparelhos</span><b>'+dev+'</b><small>● Aprovados</small></div></div><div class="sectionhead"><h2>Clientes Recentes</h2><button class="textbtn" onclick="navigate(\'clients\')">Ver todos</button></div><div id="list"></div>';renderClientList(bs.slice(0,5),'list')}function clients(){E('content').innerHTML='<div class="sectionhead"><h2>Clientes</h2><button class="textbtn" onclick="openCreate()">+ Novo</button></div><div class="searchbar"><input id="q" placeholder="Buscar cliente..." oninput="filterClients()"><select id="f" onchange="filterClients()"><option value="all">Todos</option><option value="active">Ativos</option><option value="overdue">Vencidos</option><option value="blocked">Bloqueados</option><option value="cancelled">Cancelados</option></select></div><div id="list"></div>';filterClients()}function filterClients(){let a=DATA.businesses||[];const q=(E('q')?.value||'').trim().toLowerCase(),f=E('f')?.value||'all';a=a.filter(c=>!q||String(c.name||'').toLowerCase().includes(q)||String(c.slug||'').toLowerCase().includes(q));a=a.filter(c=>{const s=status(c)[0];return f==='all'||(f==='active'&&s==='ATIVO')||(f==='overdue'&&s==='VENCIDO')||(f==='blocked'&&s==='BLOQUEADO')||(f==='cancelled'&&s==='CANCELADO')});renderClientList(a,'list')}function renderClientList(a,id){const box=E(id);box.innerHTML=a.length?a.map(c=>{const s=status(c),sub=c.subscription||{},max=sub.max_devices_override||c.license?.max_devices||'—',ini=String(c.name||'?').trim().charAt(0).toUpperCase();return '<article class="client" onclick="openClient(\''+c.id+'\')"><div class="avatar">'+esc(ini)+'</div><div class="cmain"><div class="cname">'+esc(c.name)+'</div><div class="cmeta">Vence: '+date(sub.paid_until)+'</div><div class="cmeta">'+Number(c.approved_devices||0)+'/'+esc(max)+' aparelhos</div></div><div class="cright"><span class="pill '+s[1]+'">'+s[0]+'</span><div class="price">'+money(sub.monthly_fee)+'</div><div class="cmeta">/ mês</div></div><div class="arrow">›</div></article>'}).join(''):'<div class="empty">Nenhum cliente encontrado.</div>'}function devicesHub(){const a=DATA.businesses||[];E('content').innerHTML='<div class="sectionhead"><h2>Aparelhos</h2></div>'+a.map(c=>{const max=c.subscription?.max_devices_override||c.license?.max_devices||'—';return '<div class="hubrow" onclick="openClient(\''+c.id+'\',\'devices\')"><div><b>'+esc(c.name)+'</b><small>Gerenciar aparelhos</small></div><div class="hubval">'+Number(c.approved_devices||0)+' / '+esc(max)+'<small>'+Number(c.pending_devices||0)+' pendente(s)</small></div></div>'}).join('')}function paymentsHub(){const a=DATA.businesses||[];E('content').innerHTML='<div class="sectionhead"><h2>Pagamentos</h2></div>'+a.map(c=>{const s=status(c),sub=c.subscription||{};return '<div class="hubrow" onclick="openClient(\''+c.id+'\',\'payments\')"><div><b>'+esc(c.name)+'</b><small>Vence '+date(sub.paid_until)+'</small></div><div class="hubval">'+money(sub.monthly_fee)+'<small><span class="pill '+s[1]+'">'+s[0]+'</span></small></div></div>'}).join('')}function more(){E('content').innerHTML='<div class="sectionhead"><h2>Mais</h2></div><div class="moregrid"><button class="morecard" onclick="openCreate()"><div class="ico">＋</div><strong>Novo cliente</strong><span>Cadastrar cliente e licença</span></button><button class="morecard" onclick="loadDashboard()"><div class="ico">↻</div><strong>Atualizar</strong><span>Recarregar dados do servidor</span></button><button class="morecard" onclick="navigate(\'payments\')"><div class="ico">$</div><strong>Pagamentos</strong><span>Vencimentos e mensalidades</span></button><button class="morecard" onclick="navigate(\'devices\')"><div class="ico">▣</div><strong>Aparelhos</strong><span>Aprovar ou bloquear dispositivos</span></button><button class="morecard red" onclick="logout()"><div class="ico">↪</div><strong>Sair</strong><span>Encerrar sessão do SUPERADMIN</span></button></div>'}async function openClient(id,t='summary'){try{DETAIL=await api('clientDetail',{business_id:id});detailTab=t;E('sheetBack').classList.add('on');E('sheet').classList.add('on');renderDetail()}catch(e){toast(e.message)}}function closeSheet(){E('sheetBack').classList.remove('on');E('sheet').classList.remove('on')}function renderDetail(){const b=DETAIL.business,s=DETAIL.subscription||{},st=DETAIL.license?.allowed?['ATIVO','green']:(/vencid|mensalidade/i.test(DETAIL.license?.reason||'')?['VENCIDO','red']:['BLOQUEADO','red']);E('sheetTitle').textContent=b.name;E('sheetSub').textContent='Vence '+date(s.paid_until);E('sheetStatus').className='pill '+st[1];E('sheetStatus').textContent=st[0];const tabs=[['summary','Resumo'],['devices','Aparelhos'],['payments','Pagamentos'],['app','Aplicativo'],['audit','Histórico']];E('tabs').innerHTML=tabs.map(x=>'<button class="tab '+(detailTab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>').join('');if(detailTab==='summary')summary();else if(detailTab==='devices')deviceList();else if(detailTab==='payments')paymentList();else if(detailTab==='app')appList();else auditList()}function setTab(t){detailTab=t;renderDetail()}function summary(){const b=DETAIL.business,s=DETAIL.subscription||{},l=DETAIL.license||{};E('sheetBody').innerHTML='<div class="card"><h3>Resumo do Cliente</h3><div class="line"><span>Status</span><b>'+(l.allowed?'Ativo':'Bloqueado')+'</b></div><div class="line"><span>Vencimento</span><b>'+date(s.paid_until)+'</b></div><div class="line"><span>Mensalidade</span><b>'+money(s.monthly_fee)+'</b></div><div class="line"><span>Limite de aparelhos</span><b>'+(s.max_devices_override||l.max_devices||'—')+'</b></div><div class="line"><span>Aparelhos ativos</span><b>'+Number((DETAIL.devices||[]).filter(x=>x.approval_status==='approved'&&!x.revoked_at).length)+'</b></div></div><div class="card"><h3>Ações rápidas</h3><div class="actions"><button class="good wide" onclick="openRenew()">▣ Registrar Pagamento</button><button class="primary wide" onclick="openEdit()">↻ Renovar / Editar Assinatura</button>'+(b.status!=='cancelled'?(s.manual_block?'<button class="good wide" onclick="setBlock(false)">Desbloquear Cliente</button>':'<button class="danger wide" onclick="setBlock(true)">Bloquear Cliente</button>'):'')+'<button class="secondary wide" onclick="setTab(\'devices\')">Gerenciar Aparelhos</button></div></div>'}function deviceList(){const a=DETAIL.devices||[];E('sheetBody').innerHTML='<div class="card"><h3>Aparelhos ('+a.length+')</h3>'+(a.length?a.map(x=>{const ok=x.approval_status==='approved'&&!x.revoked_at,pend=x.approval_status==='pending';return '<div class="device"><div class="line"><span><b style="color:#fff">'+esc(x.device_name||'Sem nome')+'</b><div class="uid">'+esc(x.device_uid)+'</div></span><b><span class="pill '+(ok?'green':pend?'yellow':'red')+'">'+(ok?'ATIVO':pend?'PENDENTE':'BLOQUEADO')+'</span></b></div><div class="cmeta">Último acesso: '+dt(x.last_seen_at)+'</div><div class="actions">'+(pend?'<button class="good" onclick="deviceAction(\'approveDevice\',\''+x.id+'\')">Aprovar</button>':ok?'<button class="danger" onclick="deviceAction(\'blockDevice\',\''+x.id+'\')">Bloquear</button>':'<button class="good" onclick="deviceAction(\'reactivateDevice\',\''+x.id+'\')">Reativar</button>')+'<button class="secondary" onclick="deviceAction(\'deleteDevice\',\''+x.id+'\')">Excluir</button></div></div>'}).join(''):'<div class="empty">Nenhum aparelho cadastrado.</div>')+'</div>'}function paymentList(){const a=DETAIL.payments||[];E('sheetBody').innerHTML='<div class="card"><div class="sectionhead"><h3>Pagamentos</h3><button class="textbtn" onclick="openRenew()">+ Registrar</button></div>'+(a.length?a.map(x=>'<div class="line"><span>'+dt(x.paid_at)+'<br><small>'+esc(x.payment_method||'manual')+' • '+Number(x.period_days||0)+' dias</small></span><b>'+money(x.amount)+'</b></div>').join(''):'<div class="empty">Nenhum pagamento registrado.</div>')+'</div>'}function appList(){const a=DETAIL.apps||[];E('sheetBody').innerHTML='<div class="card"><div class="sectionhead"><h3>Aplicativo</h3><button class="textbtn" onclick="openApp()">Configurar</button></div>'+(a.length?a.map(x=>'<div class="line"><span><b style="color:#fff">'+esc(x.display_name)+'</b><br><small>'+esc(x.package_name)+'</small></span><b><span class="pill '+(x.active?'green':'red')+'">'+(x.active?'ATIVO':'INATIVO')+'</span></b></div><div class="actions"><button class="primary" onclick="issueCode()">Gerar código</button><button class="secondary" onclick="openApp(\''+x.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum aplicativo configurado.</div>')+'</div>'}function auditList(){const a=DETAIL.audit||[];E('sheetBody').innerHTML='<div class="card"><h3>Histórico</h3>'+(a.length?a.map(x=>'<div class="line"><span>'+esc(x.action)+'<br><small>'+dt(x.created_at)+'</small></span><b>'+esc(x.entity_type||'')+'</b></div>').join(''):'<div class="empty">Sem eventos registrados.</div>')+'</div>'}function modal(h){E('modal').innerHTML=h;E('modalBack').classList.add('on')}function closeModal(){E('modalBack').classList.remove('on')}function modalClick(e){if(e.target===E('modalBack'))closeModal()}function openCreate(){modal('<h2>Novo Cliente</h2><div class="field"><label>NOME</label><input id="cn" placeholder="Nome do estabelecimento"></div><div class="field"><label>MENSALIDADE</label><input id="cf" type="number" step="0.01" value="99.90"></div><div class="field"><label>LIMITE DE APARELHOS</label><input id="cm" type="number" value="3"></div><div class="field"><label>PRIMEIRO VENCIMENTO</label><select id="cd"><option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option></select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createClient()">Criar Cliente</button></div>')}async function createClient(){try{await api('createClient',{name:E('cn').value,monthly_fee:E('cf').value,max_devices:E('cm').value,days:E('cd').value});closeModal();toast('Cliente criado.');await loadDashboard();navigate('clients')}catch(e){toast(e.message)}}function openRenew(){const s=DETAIL.subscription||{};modal('<h2>Registrar Pagamento</h2><div class="field"><label>VALOR</label><input id="ra" type="number" step="0.01" value="'+Number(s.monthly_fee||0).toFixed(2)+'"></div><div class="field"><label>PERÍODO</label><select id="rd"><option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option><option value="365">1 ano</option></select></div><div class="field"><label>FORMA</label><select id="rm"><option value="pix">PIX</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="manual">Manual</option></select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="good" onclick="renew()">Confirmar</button></div>')}async function renew(){try{await api('renew',{business_id:DETAIL.business.id,amount:E('ra').value,days:E('rd').value,payment_method:E('rm').value});closeModal();toast('Pagamento registrado.');await reloadDetail()}catch(e){toast(e.message)}}function openEdit(){const s=DETAIL.subscription||{};modal('<h2>Editar Assinatura</h2><div class="field"><label>VENCIMENTO</label><input id="ed" type="date" value="'+(s.paid_until?new Date(s.paid_until).toISOString().slice(0,10):'')+'"></div><div class="field"><label>MENSALIDADE</label><input id="ef" type="number" step="0.01" value="'+Number(s.monthly_fee||0).toFixed(2)+'"></div><div class="field"><label>MÁX. APARELHOS</label><input id="em" type="number" value="'+(s.max_devices_override||1)+'"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEdit()">Salvar</button></div>')}async function saveEdit(){try{await api('updateSubscription',{business_id:DETAIL.business.id,paid_until:E('ed').value,monthly_fee:E('ef').value,max_devices:E('em').value});closeModal();toast('Assinatura atualizada.');await reloadDetail()}catch(e){toast(e.message)}}async function setBlock(v){try{await api('setBlock',{business_id:DETAIL.business.id,blocked:v,reason:'Licença suspensa pelo administrador.'});toast(v?'Cliente bloqueado.':'Cliente desbloqueado.');await reloadDetail()}catch(e){toast(e.message)}}async function deviceAction(action,id){try{await api(action,{device_id:id});toast('Ação concluída.');await reloadDetail()}catch(e){toast(e.message)}}function openApp(id=''){const x=(DETAIL.apps||[]).find(a=>a.id===id)||{};modal('<h2>Configurar Aplicativo</h2><input id="aid" type="hidden" value="'+esc(x.id||'')+'"><div class="field"><label>NOME</label><input id="an" value="'+esc(x.display_name||DETAIL.business.name+' PDV')+'"></div><div class="field"><label>CÓDIGO DO APP</label><input id="ac" value="'+esc(x.app_code||'')+'" placeholder="cliente-pdv"></div><div class="field"><label>PACKAGE NAME</label><input id="ap" value="'+esc(x.package_name||'')+'" placeholder="com.empresa.pdv"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveApp()">Salvar</button></div>')}async function saveApp(){try{await api('saveApp',{business_id:DETAIL.business.id,app_id:E('aid').value,display_name:E('an').value,app_code:E('ac').value,package_name:E('ap').value,active:true});closeModal();toast('Aplicativo salvo.');await reloadDetail()}catch(e){toast(e.message)}}async function issueCode(){try{const d=await api('issueCode',{business_id:DETAIL.business.id,max_uses:10,days:365});modal('<h2>Código de Ativação</h2><div style="font-size:25px;font-weight:1000;text-align:center;padding:20px;background:#090b0e;border:1px dashed #59626e;border-radius:13px;letter-spacing:2px">'+esc(d.activation_code)+'</div><button class="primary full" style="margin-top:12px" onclick="closeModal()">Fechar</button>')}catch(e){toast(e.message)}}async function reloadDetail(){const id=DETAIL.business.id;DETAIL=await api('clientDetail',{business_id:id});renderDetail();await loadDashboard()}E('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});init();
</script></body></html>
