-columns:1fr 1fr;gap:8px;margin-top:11px}.wide{grid-column:1/-1}.sheetback,.modalback{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none}.sheetback.on,.modalback.on{display:block}.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:0;width:min(560px,100%);max-height:93vh;background:#0b0d10;border:1px solid #252a31;border-bottom:0;border-radius:23px 23px 0 0;z-index:60;transition:.2s;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet.on{transform:translateX(-50%) translateY(0)}.sheeth{position:sticky;top:0;background:rgba(11,13,16,.98);z-index:3;padding:14px;border-bottom:1px solid #242a31}.sheettop{display:flex;gap:9px;align-items:center}.back{width:38px;height:38px;border-radius:50%;border:1px solid #2c323a;background:#15191e;color:#fff;font-size:20px}.stitle{flex:1;min-width:0}.stitle b{font-size:16px}.stitle small{display:block;color:#929ba7;font-size:10px}.tabs{display:flex;gap:5px;overflow:auto;margin-top:12px}.tab{white-space:nowrap;border:0;background:transparent;color:#919aa6;padding:8px 9px;font-size:10px;font-weight:900;border-bottom:2px solid transparent}.tab.on{color:#fff;border-bottom-color:#ef1b24}.sheetbody{padding:12px}.card{background:#121519;border:1px solid #242a31;border-radius:14px;padding:13px;margin-bottom:10px}.card h3{font-size:14px;margin:0 0 9px}.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #242a31}.line:last-child{border-bottom:0}.line span{font-size:11px;color:#929ba7}.line b{font-size:12px;text-align:right}.device{background:#0d1014;border:1px solid #292f37;border-radius:12px;padding:11px;margin-bottom:8px}.uid{font:9px ui-monospace,monospace;color:#6f7985;word-break:break-all}.logohead{display:flex;gap:13px;align-items:center}.logohead .avatar{width:72px;height:72px;border-radius:18px}.modalback{z-index:80;place-items:center;padding:15px}.modalback.on{display:grid}.modal{width:min(500px,100%);max-height:88vh;o <section id="loginView" class="login"><div class="loginbox"><div class="loginbrand"><div class="mac"><span class="ma">MA</span><span class="c">C</span></div><h1>MAC SUPERADMIN</h1><p>Controle total na palma da sua mão. • v1.0.8</p></div><div class="field"><label>USUÁRIO</label><input id="user" autocomplete="username"></div><div class="field"><label>SENHA</label><input id="pass" type="password" autocomplete="current-password"></div><button id="loginBtn" class="primary full" onclick="login()">ENTRAR</button><div id="loginMsg" class="meta"></div></div></section>

<script>
const API='https://pwzmywuxdgutslqeypas.supabase.co/functions/v1/superadmin-api',EXTRA='https://pwzmywuxdgutslqeypas.supabase.co/functions/v1/superadmin-extra';let token=localStorage.getItem('mac_sa_token')||'',refreshToken=localStorage.getItem('mac_sa_refresh')||'',DATA=null,DETAIL=null,view='home',detailTab='summary',DELETE_TARGET=null;const E=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),date=v=>v?new Date(v).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—',dt=v=>v?new Date(v).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}):'—';
function toast(m){const t=E('toast');t.textContent=m;t.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('on'),2800)}async function call(url,action,p={},retry=true){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(url,{method:'POST',headers:h,body:JSON.stringify({action,...p})});let d={};try{d=await r.json()}catch{}if(r.status===401&&retry&&refreshToken&&action!=='login'&&action!=='refresh'){if(await refresh())return call(url,action,p,false)}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}const api=(a,p={},r=true)=>call(API,a,p,r),extra=(a,p={},r=true)=>call(EXTRA,a,p,r);async function refresh(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh',refresh_token:refreshToken})}),d=await r.json();if(!r.ok)return false;token=d.access_token||'';refreshToken=d.refresh_token||refreshToken;localStorage.setItem('mac_sa_token',token);localStorage.setItem('mac_sa_refresh',refreshToken);return true}catch{return false}}
async function login(){E('loginMsg').textContent='';E('loginBtn').disabled=true;try{const d=await api('login',{username:E('user').value,password:E('pass').value},false);token=d.access_token;refreshToken=d.refresh_token||'';localStorage.setItem('mac_sa_token',token);localStorage.setItem('mac_sa_refresh',refreshToken);E('pass').value='';E('loginView').classList.add('hidden');E('appView').classList.remove('hidden');E('welcome').textContent=(d.admin?.display_name||d.profile?.display_name||'SUPERADMIN')+' • Gestão central';await loadDashboard()}catch(e){E('loginMsg').textContent=e.message}finally{E('loginBtn').disabled=false}}function logout(){token='';refreshToken='';DATA=null;localStorage.removeItem('mac_sa_token');localStorage.removeItem('mac_sa_refresh');E('appView').classList.add('hidden');E('loginView').classList.remove('hidden');closeSheet()}
async function init(){if(token){try{const m=await api('me');E('loginView').classList.add('hidden');E('appView').classList.remove('hidden');E('welcome').textContent=(m.display_name||'SUPERADMIN')+' • Gestão central';await loadDashboard();return}catch{logout()}}}
async function loadDashboard(){try{DATA=await api('dashboard');try{const l=await extra('logos'),map={};(l.businesses||[]).forEach(x=>map[x.id]=x.theme||{});DATA.businesses=(DATA.businesses||[]).map(c=>({...c,theme:map[c.id]||{}}))}catch{}render()}catch(e){toast(e.message)}}function status(c){if(c.status==='cancelled')return['CANCELADO','gray'];if(c.license?.allowed)return['ATIVO','green'];if(/vencid|mensalidade/i.test(c.license?.reason||''))return['VENCIDO','red'];return['BLOQUEADO','red']}function initials(c){return String(c?.name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function avatar(c){const l=c?.theme?.logo_url;return '<div class="avatar">'+(l?'<img src="'+esc(l)+'" alt="">':esc(initials(c)))+'</div>'}function setNav(){document.querySelectorAll('.nav[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}function navigate(v){view=v;setNav();render()}function render(){if(!DATA)return;if(view==='home')home();else if(view==='clients')clients();else if(view==='devices')devices();else if(view==='payments')payments();else more()}
function home(){const m=DATA.metrics||{},bs=DATA.businesses||[],dev=bs.reduce((n,c)=>n+Number(c.approved_devices||0),0);E('content').innerHTML='<div class="metrics"><div class="metric green"><span>Clientes Ativos</span><b>'+Number(m.active||0)+'</b><small>● Ativos</small></div><div class="metric red"><span>Vencidos</span><b>'+Number(m.overdue||0)+'</b><small>● Atenção</small></div><div class="metric blue"><span>Receita (Mês)</span><b>'+money(m.mrr||0)+'</b><small>MRR</small></div><div class="metric orange"><span>Aparelhos</span><b>'+dev+'</b><small>● Aprovados</small></div></div><div class="section"><h2>Clientes Recentes</h2><button class="link" onclick="navigate(\'clients\')">Ver todos</button></div><div id="list"></div>';renderList(bs.slice(0,5))}function clients(){E('content').innerHTML='<div class="section"><h2>Clientes</h2><button class="link" onclick="openCreate()">+ Novo</button></div><div class="search"><input id="q" placeholder="Buscar cliente..." oninput="filterClients()"><select id="f" onchange="filterClients()"><option value="all">Todos</option><option value="active">Ativos</option><option value="overdue">Vencidos</option><option value="blocked">Bloqueados</option><option value="cancelled">Cancelados</option></select></div><div id="list"></div>';filterClients()}function filterClients(){let a=DATA.businesses||[];const q=(E('q')?.value||'').toLowerCase(),f=E('f')?.value||'all';a=a.filter(c=>!q||String(c.name||'').toLowerCase().includes(q));a=a.filter(c=>{const s=status(c)[0];return f==='all'||f==='active'&&s==='ATIVO'||f==='overdue'&&s==='VENCIDO'||f==='blocked'&&s==='BLOQUEADO'||f==='cancelled'&&s==='CANCELADO'});renderList(a)}function renderList(a){const box=E('list');box.innerHTML=a.length?a.map(c=>{const s=status(c),sub=c.subscription||{},max=sub.max_devices_override||c.license?.max_devices||'—',safeName=String(c.name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");return '<article class="client" onclick="openClient(\''+c.id+'\')">'+avatar(c)+'<div class="cmain"><div class="cname">'+esc(c.name)+'</div><div class="meta">Vence: '+date(sub.paid_until)+'</div><div class="meta">'+Number(c.approved_devices||0)+'/'+esc(max)+' aparelhos</div></div><div class="cright"><span class="pill '+s[1]+'">'+s[0]+'</span><div class="price">'+money(sub.monthly_fee)+'</div></div><button class="trash" onclick="event.stopPropagation();openDeleteFor(\''+c.id+'\',\''+safeName+'\')">🗑</button></article>'}).join(''):'<div class="empty">Nenhum cliente encontrado.</div>'}
function devices(){const a=DATA.businesses||[];E('content').innerHTML='<div class="section"><h2>Aparelhos</h2></div>'+a.map(c=>'<div class="row" onclick="openClient(\''+c.id+'\',\'devices\')"><div style="display:flex;align-items:center;gap:9px">'+avatar(c)+'<div><b>'+esc(c.name)+'</b><small>Gerenciar aparelhos</small></div></div><div class="rval">'+Number(c.approved_devices||0)+'<small>'+Number(c.pending_devices||0)+' pendente(s)</small></div></div>').join('')}function payments(){const a=DATA.businesses||[];E('content').innerHTML='<div class="section"><h2>Pagamentos</h2></div>'+a.map(c=>{const s=status(c),sub=c.subscription||{};return '<div class="row" onclick="openClient(\''+c.id+'\',\'payments\')"><div style="display:flex;align-items:center;gap:9px">'+avatar(c)+'<div><b>'+esc(c.name)+'</b><small>Vence '+date(sub.paid_until)+'</small></div></div><div class="rval">'+money(sub.monthly_fee)+'<small><span class="pill '+s[1]+'">'+s[0]+'</span></small></div></div>'}).join('')}function more(){E('content').innerHTML='<div class="section"><h2>Mais</h2></div><div class="more"><button class="mcard" onclick="openCreate()"><span class="mi">＋</span><strong>Novo cliente</strong><span>Cadastrar cliente</span></button><button class="mcard" onclick="loadDashboard()"><span class="mi">↻</span><strong>Atualizar</strong><span>Recarregar servidor</span></button><button class="mcard" onclick="navigate(\'payments\')"><span class="mi">$</span><strong>Pagamentos</strong><span>Mensalidades</span></button><button class="mcard" onclick="navigate(\'devices\')"><span class="mi">▣</span><strong>Aparelhos</strong><span>Dispositivos</span></button><button class="mcard" onclick="logout()"><span class="mi">↪</span><strong>Sair</strong><span>Encerrar sessão</span></button></div>'}
async function openClient(id,t='summary'){try{DETAIL=await api('clientDetail',{business_id:id});detailTab=t;E('sheetBack').classList.add('on');E('sheet').classList.add('on');renderDetail()}catch(e){toast(e.message)}}function closeSheet(){E('sheetBack').classList.remove('on');E('sheet').classList.remove('on')}function renderDetail(){const b=DETAIL.business,s=DETAIL.subscription||{},st=DETAIL.license?.allowed?['ATIVO','green']:[/vencid|mensalidade/i.test(DETAIL.license?.reason||'')?'VENCIDO':'BLOQUEADO','red'];E('sheetTitle').textContent=b.name;E('sheetSub').textContent='Vence '+date(s.paid_until);E('sheetStatus').className='pill '+st[1];E('sheetStatus').textContent=st[0];const tabs=[['summary','Resumo'],['devices','Aparelhos'],['payments','Pagamentos'],['app','Aplicativo'],['audit','Histórico']];E('tabs').innerHTML=tabs.map(x=>'<button class="tab '+(detailTab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>').join('');({summary,devices:deviceList,payments:paymentList,app:appList,audit:auditList}[detailTab]||summary)()}function setTab(t){detailTab=t;renderDetail()}
function summary(){const b=DETAIL.business,s=DETAIL.subscription||{},l=DETAIL.license||{};E('sheetBody').innerHTML='<div class="card"><div class="logohead">'+avatar(b)+'<div style="flex:1"><h3 style="margin:0 0 4px">Logo do cliente</h3><div class="meta">PNG, JPG ou WEBP</div><div class="actions"><button class="secondary" onclick="pickLogo()">ALTERAR LOGO</button>'+(b.theme?.logo_url?'<button class="secondary" onclick="removeLogo()">REMOVER LOGO</button>':'')+'</div></div></div></div><div class="card"><h3>Resumo do Cliente</h3><div class="line"><span>Status</span><b>'+(l.allowed?'Ativo':'Bloqueado')+'</b></div><div class="line"><span>Vencimento</span><b>'+date(s.paid_until)+'</b></div><div class="line"><span>Mensalidade</span><b>'+money(s.monthly_fee)+'</b></div><div class="line"><span>Limite de aparelhos</span><b>'+(s.max_devices_override||l.max_devices||'—')+'</b></div></div><div class="card"><h3>Ações</h3><div class="actions"><button class="good wide" onclick="openRenew()">Registrar Pagamento</button><button class="primary wide" onclick="openEdit()">Renovar / Editar</button>'+(b.status!=='cancelled'?(s.manual_block?'<button class="good wide" onclick="setBlock(false)">Desbloquear Cliente</button>':'<button class="danger wide" onclick="setBlock(true)">Bloquear Cliente</button>'):'')+'<button class="secondary wide" onclick="setTab(\'devices\')">Gerenciar Aparelhos</button><button class="danger wide" onclick="cancelClient()">Cancelar e preservar dados</button><button class="danger wide" style="background:#d10e19;border:1px solid #ff535b" onclick="openDelete()">🗑 REMOVER CLIENTE DEFINITIVAMENTE</button></div></div>'}
function deviceList(){const a=DETAIL.devices||[];E('sheetBody').innerHTML='<div class="card"><h3>Aparelhos ('+a.length+')</h3>'+(a.length?a.map(x=>{const ok=x.approval_status==='approved'&&!x.revoked_at,pend=x.approval_status==='pending';return '<div class="device"><div class="line"><span><b style="color:#fff">'+esc(x.device_name||'Sem nome')+'</b><div class="uid">'+esc(x.device_uid)+'</div></span><b><span class="pill '+(ok?'green':pend?'yellow':'red')+'">'+(ok?'ATIVO':pend?'PENDENTE':'BLOQUEADO')+'</span></b></div><div class="meta">Último acesso: '+dt(x.last_seen_at)+'</div><div class="actions">'+(pend?'<button class="good" onclick="deviceAction(\'approveDevice\',\''+x.id+'\')">Aprovar</button>':ok?'<button class="danger" onclick="deviceAction(\'blockDevice\',\''+x.id+'\')">Bloquear</button>':'<button class="good" onclick="deviceAction(\'reactivateDevice\',\''+x.id+'\')">Reativar</button>')+'<button class="secondary" onclick="deviceAction(\'deleteDevice\',\''+x.id+'\')">Excluir</button></div></div>'}).join(''):'<div class="empty">Nenhum aparelho.</div>')+'</div>'}function paymentList(){const a=DETAIL.payments||[];E('sheetBody').innerHTML='<div class="card"><div class="section"><h3>Pagamentos</h3><button class="link" onclick="openRenew()">+ Registrar</button></div>'+(a.length?a.map(x=>'<div class="line"><span>'+dt(x.paid_at)+'<br><small>'+esc(x.payment_method||'manual')+'</small></span><b>'+money(x.amount)+'</b></div>').join(''):'<div class="empty">Nenhum pagamento.</div>')+'</div>'}function appList(){const a=DETAIL.apps||[];E('sheetBody').innerHTML='<div class="card"><div class="section"><h3>Aplicativo</h3><button class="link" onclick="openApp()">Configurar</button></div>'+(a.length?a.map(x=>'<div class="line"><span><b style="color:#fff">'+esc(x.display_name)+'</b><br><small>'+esc(x.package_name)+'</small></span><b><span class="pill '+(x.active?'green':'red')+'">'+(x.active?'ATIVO':'INATIVO')+'</span></b></div><div class="actions"><button class="primary" onclick="issueCode()">Gerar código</button><button class="secondary" onclick="openApp(\''+x.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum aplicativo.</div>')+'</div>'}function auditList(){const a=DETAIL.audit||[];E('sheetBody').innerHTML='<div class="card"><h3>Histórico</h3>'+(a.length?a.map(x=>'<div class="line"><span>'+esc(x.action)+'<br><small>'+dt(x.created_at)+'</small></span><b>'+esc(x.entity_type||'')+'</b></div>').join(''):'<div class="empty">Sem eventos.</div>')+'</div>'}
function modal(h){E('modal').innerHTML=h;E('modalBack').classList.add('on')}function closeModal(){E('modalBack').classList.remove('on')}function modalClick(e){if(e.target===E('modalBack'))closeModal()}function openCreate(){modal('<h2>Novo Cliente</h2><div class="field"><label>NOME</label><input id="cn"></div><div class="field"><label>MENSALIDADE</label><input id="cf" type="number" step="0.01" value="99.90"></div><div class="field"><label>LIMITE DE APARELHOS</label><input id="cm" type="number" value="3"></div><div class="field"><label>PRIMEIRO VENCIMENTO</label><select id="cd"><option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option></select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createClient()">Criar</button></div>')}async function createClient(){try{await api('createClient',{name:E('cn').value,monthly_fee:E('cf').value,max_devices:E('cm').value,days:E('cd').value});closeModal();toast('Cliente criado.');await loadDashboard();navigate('clients')}catch(e){toast(e.message)}}function openRenew(){const s=DETAIL.subscription||{};modal('<h2>Registrar Pagamento</h2><div class="field"><label>VALOR</label><input id="ra" type="number" step="0.01" value="'+Number(s.monthly_fee||0).toFixed(2)+'"></div><div class="field"><label>PERÍODO</label><select id="rd"><option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option><option value="365">1 ano</option></select></div><div class="field"><label>FORMA</label><select id="rm"><option value="pix">PIX</option><option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option><option value="manual">Manual</option></select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="good" onclick="renew()">Confirmar</button></div>')}async function renew(){try{await api('renew',{business_id:DETAIL.business.id,amount:E('ra').value,days:E('rd').value,payment_method:E('rm').value});closeModal();toast('Pagamento registrado.');await reloadDetail()}catch(e){toast(e.message)}}function openEdit(){const s=DETAIL.subscription||{};modal('<h2>Editar Assinatura</h2><div class="field"><label>VENCIMENTO</label><input id="ed" type="date" value="'+(s.paid_until?new Date(s.paid_until).toISOString().slice(0,10):'')+'"></div><div class="field"><label>MENSALIDADE</label><input id="ef" type="number" step="0.01" value="'+Number(s.monthly_fee||0).toFixed(2)+'"></div><div class="field"><label>MÁX. APARELHOS</label><input id="em" type="number" value="'+(s.max_devices_override||1)+'"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEdit()">Salvar</button></div>')}async function saveEdit(){try{await api('updateSubscription',{business_id:DETAIL.business.id,paid_until:E('ed').value,monthly_fee:E('ef').value,max_devices:E('em').value});closeModal();toast('Atualizado.');await reloadDetail()}catch(e){toast(e.message)}}async function setBlock(v){try{await api('setBlock',{business_id:DETAIL.business.id,blocked:v,reason:'Licença suspensa pelo administrador.'});toast(v?'Cliente bloqueado.':'Cliente desbloqueado.');await reloadDetail()}catch(e){toast(e.message)}}async function deviceAction(action,id){try{await api(action,{device_id:id});toast('Ação concluída.');await reloadDetail()}catch(e){toast(e.message)}}async function cancelClient(){if(!confirm('Cancelar este cliente e preservar os dados?'))return;try{await api('deleteClient',{business_id:DETAIL.business.id});toast('Cliente cancelado.');await reloadDetail()}catch(e){toast(e.message)}}
function openApp(id=''){const x=(DETAIL.apps||[]).find(a=>a.id===id)||{};modal('<h2>Aplicativo</h2><input id="aid" type="hidden" value="'+esc(x.id||'')+'"><div class="field"><label>NOME</label><input id="an" value="'+esc(x.display_name||DETAIL.business.name+' PDV')+'"></div><div class="field"><label>CÓDIGO</label><input id="ac" value="'+esc(x.app_code||'')+'"></div><div class="field"><label>PACKAGE NAME</label><input id="ap" value="'+esc(x.package_name||'')+'"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveApp()">Salvar</button></div>')}async function saveApp(){try{await api('saveApp',{business_id:DETAIL.business.id,app_id:E('aid').value,display_name:E('an').value,app_code:E('ac').value,package_name:E('ap').value,active:true});closeModal();toast('Aplicativo salvo.');await reloadDetail()}catch(e){toast(e.message)}}async function issueCode(){try{const d=await api('issueCode',{business_id:DETAIL.business.id,max_uses:10,days:365});modal('<h2>Código de Ativação</h2><div style="font-size:25px;font-weight:1000;text-align:center;padding:20px;background:#090b0e;border:1px dashed #59626e;border-radius:13px">'+esc(d.activation_code)+'</div><button class="primary full" style="margin-top:12px" onclick="closeModal()">Fechar</button>')}catch(e){toast(e.message)}}
function pickLogo(){E('logoPicker').value='';E('logoPicker').click()}E('logoPicker').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=await resizeLogo(f);await extra('saveLogo',{business_id:DETAIL.business.id,logo_data:data});toast('Logo atualizada.');await reloadDetail()}catch(err){toast(err.message)}});function resizeLogo(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(Error('Falha ao ler imagem.'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('Imagem inválida.'));im.onload=()=>{const z=160,c=document.createElement('canvas');c.width=c.height=z;const x=c.getContext('2d'),s=Math.min(152/im.width,152/im.height),w=im.width*s,h=im.height*s;x.clearRect(0,0,z,z);x.drawImage(im,(z-w)/2,(z-h)/2,w,h);resolve(c.toDataURL('image/webp',.84))};im.src=r.result};r.readAsDataURL(file)})}async function removeLogo(){if(!confirm('Remover a logo?'))return;try{await extra('saveLogo',{business_id:DETAIL.business.id,logo_data:''});toast('Logo removida.');await reloadDetail()}catch(e){toast(e.message)}}
function openDeleteFor(id,name){DELETE_TARGET={id,name};showDelete()}function openDelete(){DELETE_TARGET={id:DETAIL.business.id,name:DETAIL.business.name};showDelete()}function showDelete(){modal('<h2>🗑 Remover cliente</h2><div class="warn"><b>EXCLUSÃO DEFINITIVA.</b><br>O cadastro e os dados vinculados serão apagados.<br><br>Digite exatamente:<br><b>'+esc(DELETE_TARGET.name)+'</b></div><div class="field"><label>NOME DO CLIENTE</label><input id="delName" autocomplete="off"></div><div class="actions"><button class="secondary" onclick="closeModal()">Voltar</button><button class="danger" onclick="deletePermanent()">REMOVER</button></div>')}async function deletePermanent(){try{if(!DELETE_TARGET)throw Error('Cliente inválido.');const t=DELETE_TARGET;await extra('removeClientPermanent',{business_id:t.id,confirm_name:E('delName').value});DELETE_TARGET=null;closeModal();if(DETAIL?.business?.id===t.id){closeSheet();DETAIL=null}toast(t.name+' removido definitivamente.');await loadDashboard();navigate('clients')}catch(e){toast(e.message)}}async function reloadDetail(){const id=DETAIL.business.id;DETAIL=await api('clientDetail',{business_id:id});renderDetail();await loadDashboard()}E('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});init();
</script></body></html>
