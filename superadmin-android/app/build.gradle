plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macflay.superadmin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.macflay.superadmin'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('SIGNING_STORE_FILE') ?: '../superadmin-release.jks')
            storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: 'changeit'
            keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'superadmin'
            keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: 'changeit'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}
